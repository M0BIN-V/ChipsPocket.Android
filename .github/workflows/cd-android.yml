name: CD - Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  deploy:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "Tag: $TAG"
          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Telegram - Android Deploy Started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚀 <b>ChipsPocket Android Build Started</b>
          
          📱 Service: <b>Android</b>
          📦 Version: <code>${{ steps.version.outputs.version }}</code>
          🏷 Tag: <code>${GITHUB_REF_NAME}</code>
          
          ⏳ Building Android APK and creating GitHub Release..."

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE" \
            -d parse_mode="HTML"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor assets
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "chipspocket-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Chips Pocket ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: chipspocket-${{ steps.version.outputs.version }}.apk

      - name: Telegram - Android Deploy Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ <b>ChipsPocket Android Build Successful</b>
          
          📱 Service: <b>Android</b>
          📦 Version: <code>${{ steps.version.outputs.version }}</code>
          🏷 Tag: <code>${GITHUB_REF_NAME}</code>
          🚀 Status: <b>APK built and released successfully</b>
          
          🔗 <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}\">Download APK</a>
          🔗 <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">View GitHub Actions</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE" \
            -d parse_mode="HTML"

      - name: Telegram - Android Deploy Failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ <b>ChipsPocket Android Build Failed</b>
          
          📱 Service: <b>Android</b>
          📦 Version: <code>${{ steps.version.outputs.version }}</code>
          🏷 Tag: <code>${GITHUB_REF_NAME}</code>
          💥 Status: <b>Build or release failed</b>
          
          🔗 <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">View Error Logs</a>"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE" \
            -d parse_mode="HTML"
